<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แฟลชการ์ด คำกริยาญี่ปุ่น กลุ่ม 1·2·3</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent1: #3b82f6;
    --accent2: #10b981;
    --accent3: #f59e0b;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 0.3rem;
    text-align: center;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 1rem;
    text-align: center;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 1.2rem;
  }
  button, select {
    background: var(--card);
    color: var(--text);
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover, select:hover { background: #334155; }
  button.active { outline: 2px solid var(--accent1); }
  .group-btn.g1.active { outline-color: var(--accent1); }
  .group-btn.g2.active { outline-color: var(--accent2); }
  .group-btn.g3.active { outline-color: var(--accent3); }
  .progress {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 0.8rem;
  }
  .card-container {
    perspective: 1200px;
    width: min(440px, 95vw);
    height: 320px;
    margin-bottom: 1.5rem;
  }
  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .front {
    background: linear-gradient(145deg, #1e293b, #0f172a);
    border: 2px solid #334155;
  }
  .back {
    background: linear-gradient(145deg, #1e3a5f, #0f172a);
    border: 2px solid #3b82f6;
    transform: rotateY(180deg);
  }
  .group-tag {
    position: absolute;
    top: 12px;
    left: 14px;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .g1 .group-tag { background: #1e40af; color: #bfdbfe; }
  .g2 .group-tag { background: #065f46; color: #a7f3d0; }
  .g3 .group-tag { background: #92400e; color: #fde68a; }
  .jp {
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 2rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
    text-align: center;
  }
  .label {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.2rem;
  }
  .meaning {
    font-size: 1.15rem;
    text-align: center;
    line-height: 1.4;
    margin-top: 0.6rem;
  }
  .forms {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.55rem 1.1rem;
    width: 100%;
    margin-top: 0.7rem;
  }
  .forms div {
    display: flex;
    flex-direction: column;
    border-bottom: 1px dashed #334155;
    padding-bottom: 5px;
  }
  .forms .f-val {
    font-family: "Noto Sans JP", sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    color: #e2e8f0;
  }
  .forms .f-mean {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 2px;
    line-height: 1.25;
  }
  .nav {
    display: flex;
    gap: 0.8rem;
    margin-bottom: 1rem;
  }
  .nav button {
    min-width: 100px;
    font-size: 1rem;
  }
  .hint {
    color: var(--muted);
    font-size: 0.75rem;
    text-align: center;
  }
  .mode-toggle {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 0.8rem;
  }
  @media (max-width: 480px) {
    .jp { font-size: 1.5rem; }
    .card-container { height: 340px; }
  }
</style>
</head>
<body>
  <h1>แฟลชการ์ด คำกริยาญี่ปุ่น</h1>
  <p class="subtitle">กลุ่ม 1 · 2 · 3 — แตะการ์ดเพื่อพลิก · กดลูกศรเพื่อเปลี่ยนใบ</p>

  <div class="controls">
    <button class="group-btn g1 active" data-group="1">กลุ่ม 1</button>
    <button class="group-btn g2 active" data-group="2">กลุ่ม 2</button>
    <button class="group-btn g3 active" data-group="3">กลุ่ม 3</button>
    <button id="shuffleBtn">สุ่ม</button>
    <button id="resetBtn">รีเซ็ต</button>
  </div>

  <div class="mode-toggle">
    <button id="modeDict" class="active">ます → ความหมาย</button>
    <button id="modeMean">ความหมาย → ます</button>
  </div>

  <div class="progress" id="progress">1 / 107</div>

  <div class="card-container">
    <div class="card" id="card">
      <div class="face front" id="front">
        <span class="group-tag" id="tag">กลุ่ม 1</span>
        <div class="label" id="frontLabel">รูปます</div>
        <div class="jp" id="frontJP">はたらきます</div>
      </div>
      <div class="face back" id="back">
        <span class="group-tag" id="tagBack">กลุ่ม 1</span>
        <div class="label" id="backLabel">ความหมาย</div>
        <div class="meaning" id="meaning">ทำงาน</div>
        <div class="forms" id="forms">
          <div>
            <span class="f-val" id="fDict">はたらく</span>
            <span class="f-mean" id="mDict">ทำงาน</span>
          </div>
          <div>
            <span class="f-val" id="fTe">はたらいて</span>
            <span class="f-mean" id="mTe">กำลังทำงาน / ทำงานแล้ว...</span>
          </div>
          <div>
            <span class="f-val" id="fNai">はたらかない</span>

          </div>
          <div>

            <span class="f-mean" id="mTa">ทำงานแล้ว</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="nav">
    <button id="prevBtn">← ก่อนหน้า</button>
    <button id="flipBtn">พลิก</button>
    <button id="nextBtn">ถัดไป →</button>
  </div>
  <p class="hint">แป้นพิมพ์: ← → พลิก (Space / Enter) · S = สุ่ม</p>

  {g:3, dict:"けっこんする", masu:"けっこんします", te:"けっこんして", nai:"けっこんしない", ta:"けっこんした", mean:"แต่งงาน"},
  {g:3, dict:"けんがくする", masu:"けんがくします", te:"けんがくして", nai:"けんがくしない", ta:"けんがくした", mean:"ทัศนศึกษา, เยี่ยมชม"},
  {g:3, dict:"けんきゅうする", masu:"けんきゅうします", te:"けんきゅうして", nai:"けんきゅうしない", ta:"けんきゅうした", mean:"ค้นคว้า, วิจัย"},
  {g:3, dict:"コピーする", masu:"コピーします", te:"コピーして", nai:"コピーしない", ta:"コピーした", mean:"ถ่ายเอกสาร"},
  {g:3, dict:"さんぽする", masu:"さんぽします", te:"さんぽして", nai:"さんぽしない", ta:"さんぽした", mean:"เดินเล่น [ในสวนสาธารณะ]"},
  {g:3, dict:"ざんぎょうする", masu:"ざんぎょうします", te:"ざんぎょうして", nai:"ざんぎょうしない", ta:"ざんぎょうした", mean:"ทำงานล่วงเวลา"},
  {g:3, dict:"する", masu:"します", te:"して", nai:"しない", ta:"した", mean:"ทำ, ดำเนินการ, เล่น / ผูก [เนกไท]"},
  {g:3, dict:"しゅうりする", masu:"しゅうりします", te:"しゅうりして", nai:"しゅうりしない", ta:"しゅうりした", mean:"ซ่อมแซม, แก้ไข"},
  {g:3, dict:"しゅっちょうする", masu:"しゅっちょうします", te:"しゅっちょうして", nai:"しゅっちょうしない", ta:"しゅっちょうした", mean:"ไปทำงานนอกสถานที่"},
  {g:3, dict:"しょうかいする", masu:"しょうかいします", te:"しょうかいして", nai:"しょうかいしない", ta:"しょうかいした", mean:"แนะนำ"},
  {g:3, dict:"しょくじする", masu:"しょくじします", te:"しょくじして", nai:"しょくじしない", ta:"しょくじした", mean:"รับประทานอาหาร"},
  {g:3, dict:"しんぱいする", masu:"しんぱいします", te:"しんぱいして", nai:"しんぱいしない", ta:"しんぱいした", mean:"เป็นห่วง, เป็นกังวล"},
  {g:3, dict:"せつめいする", masu:"せつめいします", te:"せつめいして", nai:"せつめいしない", ta:"せつめいした", mean:"อธิบาย"},
  {g:3, dict:"せんたくする", masu:"せんたくします", te:"せんたくして", nai:"せんたくしない", ta:"せんたくした", mean:"ซัก (ผ้า)"},
  {g:3, dict:"そうじする", masu:"そうじします", te:"そうじして", nai:"そうじしない", ta:"そうじした", mean:"ทำความสะอาด (ห้อง)"},
  {g:3, dict:"つれてくる", masu:"つれてきます", te:"つれてきて", nai:"つれてこない", ta:"つれてきた", mean:"พา (คน) มา"},
  {g:3, dict:"でんわする", masu:"でんわします", te:"でんわして", nai:"でんわしない", ta:"でんわした", mean:"โทรศัพท์"},
  {g:3, dict:"べんきょうする", masu:"べんきょうします", te:"べんきょうして", nai:"べんきょうしない", ta:"べんきょうした", mean:"เรียน"},
  {g:3, dict:"もってくる", masu:"もってきます", te:"もってきて", nai:"もってこない", ta:"もってきた", mean:"นำ (สิ่งของ) มา"},
  {g:3, dict:"よやくする", masu:"よやくします", te:"よやくして", nai:"よやくしない", ta:"よやくした", mean:"จอง"},
  {g:3, dict:"りゅうがくする", masu:"りゅうがくします", te:"りゅうがくして", nai:"りゅうがくしない", ta:"りゅうがくした", mean:"ศึกษาที่ต่างประเทศ"},
];

let filtered = [...verbs];
let idx = 0;
let flipped = false;
let mode = "dict"; // "dict" or "mean"
let activeGroups = new Set([1,2,3]);

const card = document.getElementById("card");
const frontJP = document.getElementById("frontJP");
const frontLabel = document.getElementById("frontLabel");
const meaning = document.getElementById("meaning");
const fDict = document.getElementById("fDict");
const fTe = document.getElementById("fTe");
const fNai = document.getElementById("fNai");
const fTa = document.getElementById("fTa");
const mDict = document.getElementById("mDict");
const mTe = document.getElementById("mTe");
const mNai = document.getElementById("mNai");
const mTa = document.getElementById("mTa");
const tag = document.getElementById("tag");
const tagBack = document.getElementById("tagBack");
const progress = document.getElementById("progress");
const front = document.getElementById("front");
const back = document.getElementById("back");

/** สร้างคำแปลของแต่ละรูปจากความหมายหลัก */
function formMeanings(base) {
  // ตัดส่วนในวงเล็บออกเพื่อให้แปลดูสะอาด
  const clean = base.replace(/\s*[\[\(].*?[\]\)]/g, "").trim();
  // กรณีมีหลายความหมาย คั่นด้วย ,
  const parts = clean.split(/\s*,\s*/).map(p => p.trim()).filter(Boolean);
  const main = parts[0] || clean;

  return {
    dict: base,                                    // รูปธรรมดา = ความหมายเดิม
    te:   "กำลัง" + main + " / " + main + "แล้ว...", // て-form
    nai:  "ไม่" + main,                             // ปฏิเสธ
    ta:   main + "แล้ว"                            // อดีต
  };
}

function applyFilter() {
  filtered = verbs.filter(v => activeGroups.has(v.g));
  if (filtered.length === 0) filtered = [...verbs];
  idx = 0;
  flipped = false;
  render();
}

function render() {
  if (filtered.length === 0) return;
  const v = filtered[idx];
  const gClass = "g" + v.g;
  front.className = "face front " + gClass;
  back.className = "face back " + gClass;
  tag.textContent = "กลุ่ม " + v.g;
  tagBack.textContent = "กลุ่ม " + v.g;

  const backLabel = document.getElementById("backLabel");
  if (mode === "dict") {
    frontLabel.textContent = "รูปます";
    frontJP.textContent = v.masu;
    backLabel.textContent = "ความหมาย";
    meaning.textContent = v.mean;
  } else {
    frontLabel.textContent = "ความหมาย";
    frontJP.textContent = v.mean;
    backLabel.textContent = "รูปます";
    meaning.textContent = v.masu;
  }

  // รูปญี่ปุ่น
  fDict.textContent = v.dict;
  fTe.textContent = v.te;
  fNai.textContent = v.nai;
  fTa.textContent = v.ta;

  // คำแปลของแต่ละรูป
  const fm = formMeanings(v.mean);
  mDict.textContent = fm.dict;
  mTe.textContent = fm.te;
  mNai.textContent = fm.nai;
  mTa.textContent = fm.ta;

  card.classList.toggle("flipped", flipped);
  progress.textContent = (idx + 1) + " / " + filtered.length;
}

function flip() {
  flipped = !flipped;
  card.classList.toggle("flipped", flipped);
}

function next() {
  flipped = false;
  idx = (idx + 1) % filtered.length;
  render();
}

function prev() {
  flipped = false;
  idx = (idx - 1 + filtered.length) % filtered.length;
  render();
}

function shuffle() {
  for (let i = filtered.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
  }
  idx = 0;
  flipped = false;
  render();
}

// Event listeners
card.addEventListener("click", flip);
document.getElementById("flipBtn").addEventListener("click", flip);
document.getElementById("nextBtn").addEventListener("click", next);
document.getElementById("prevBtn").addEventListener("click", prev);
document.getElementById("shuffleBtn").addEventListener("click", shuffle);
document.getElementById("resetBtn").addEventListener("click", () => {
  filtered = verbs.filter(v => activeGroups.has(v.g));
  idx = 0; flipped = false; render();
});

document.querySelectorAll(".group-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const g = +btn.dataset.group;
    if (activeGroups.has(g)) {
      if (activeGroups.size > 1) activeGroups.delete(g);
    } else {
      activeGroups.add(g);
    }
    btn.classList.toggle("active", activeGroups.has(g));
    applyFilter();
  });
});

document.getElementById("modeDict").addEventListener("click", () => {
  mode = "dict";
  document.getElementById("modeDict").classList.add("active");
  document.getElementById("modeMean").classList.remove("active");
  flipped = false; render();
});
document.getElementById("modeMean").addEventListener("click", () => {
  mode = "mean";
  document.getElementById("modeMean").classList.add("active");
  document.getElementById("modeDict").classList.remove("active");
  flipped = false; render();
});

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
  else if (e.key === "Enter") { e.preventDefault(); flip(); }
  else if (e.key === "s" || e.key === "S") { shuffle(); }
});

// Init
render();
</script>
</body>
</html>
